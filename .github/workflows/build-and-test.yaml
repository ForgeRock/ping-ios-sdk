name: Build and Test

on:
  workflow_call:
    inputs:
      head_sha:
        description: Head commit SHA to check out
        type: string
      head_repo:
        description: Head repository to check out
        type: string
    secrets:
      SLACK_WEBHOOK:
        description: 'Slack Notifier Webhook'
        required: true
      DAVINCI_E2E_CONFIG:
        description: 'DaVinci e2e test configuration JSON'
        required: false
      CLOUDSMITH_KEYLESS_TOKEN:
        description: 'Cloudsmith API key for the private Keyless registry (keyless scope). Required to run RecognizeTests; absent on fork PRs, which then skip those tests.'
        required: false
  
env:
  WORKSPACE: SampleApps/Ping.xcworkspace
  SCHEME: PingTestHost
  CONFIGURATION: Debug
  DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.2
  XCODE_VERSION: '26.2'
  DERIVED_DATA_PATH: DerivedData

jobs:
  build-and-test:
    runs-on: macos-26-xlarge
    timeout-minutes: 40

    steps:
      # Clone the repo
      - name: Clone the repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
          repository: ${{ inputs.head_repo || github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
          fetch-depth: 0

      # Set target Xcode version. For more details and options see:
      # https://github.com/actions/runner-images/blob/main/images/macos/macos-15-arm64-Readme.md
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app && /usr/bin/xcodebuild -version

      # # Cache DerivedData
      # - name: Cache DerivedData
      #   if: always()
      #   uses: actions/cache@v5
      #   with:
      #     path: ${{ env.DERIVED_DATA_PATH }}
      #     key: ${{ runner.os }}-derived-data-${{ env.XCODE_VERSION }}-${{ hashFiles('**/Podfile.lock', '**/*.pbxproj') }}
      #     restore-keys: |
      #       ${{ runner.os }}-derived-data-${{ env.XCODE_VERSION }}-

      # Cache Swift Packages
      - name: Cache Swift Packages
        if: always()
        uses: actions/cache@v5
        with:
          path: SourcePackages
          # Look for Package.resolved inside your workspace or project
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Install xcresultparser
      - name: Install xcresultparser
        run: |
          curl -LO https://github.com/a7ex/xcresultparser/releases/download/1.9.3/xcresultparser.zip
          unzip xcresultparser.zip
          # Fix: The binary is inside the 'product' folder
          chmod +x product/xcresultparser
          sudo mv product/xcresultparser /usr/local/bin/

      # RecognizeTests depends on KeylessSDK from the private Cloudsmith registry.
      # When the token secret is present (internal PRs, branch pushes, /run-ci fork runs),
      # configure the registry and enable the Recognize targets. Fork PRs have no access
      # to secrets, so RecognizeTests is stripped from the test plan instead — everything
      # else still runs.
      - name: Configure Cloudsmith registry (Recognize)
        if: ${{ env.CLOUDSMITH_KEYLESS_TOKEN != '' }}
        env:
          CLOUDSMITH_KEYLESS_TOKEN: ${{ secrets.CLOUDSMITH_KEYLESS_TOKEN }}
        run: |
          # --global is required: without it the scope mapping lands in the
          # project-local .swiftpm/, which xcodebuild does not read. It must go
          # to the user-level config (~/.swiftpm/configuration/registries.json).
          swift package-registry set --global --scope keyless https://swift.cloudsmith.io/keyless/partners/
          # Headless-runner auth must avoid the keychain: `swift package-registry
          # login` stores the credential there, and on macOS xcodebuild's SwiftPM
          # then blocks on a keychain ACL consent prompt that nobody can answer
          # on a CI runner (CI run for d700231 hung 15 min with zero output).
          # Instead: write the token-type authentication section into
          # registries.json plus a netrc entry. SwiftPM uses authentication.type
          # "token" to send the netrc password as a Bearer token. Note login
          # must NOT run — it would create the keychain entry again.
          python3 - <<'EOF'
          import json, os
          path = os.path.expanduser("~/.swiftpm/configuration/registries.json")
          with open(path) as f:
              cfg = json.load(f)
          cfg.setdefault("authentication", {})
          cfg["authentication"]["swift.cloudsmith.io"] = {
              "loginAPIPath": "/keyless/partners",
              "type": "token",
          }
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
          print("registries.json authentication section written")
          EOF
          printf 'machine swift.cloudsmith.io\nlogin token\npassword %s\n' "$CLOUDSMITH_KEYLESS_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc
          touch Recognize/.registry-enabled

      # The test plan's RecognizeTests entry resolves through the workspace graph
      # (container:../Recognize/Recognize.xcodeproj). Ping.xcworkspace cannot reference
      # Recognize.xcodeproj — that would break local builds for users without registry
      # credentials — so swap to PingWithRecognize.xcworkspace when the registry is
      # configured. All other test targets resolve identically in both workspaces;
      # fork PRs keep Ping.xcworkspace and strip the entry instead (step below).
      - name: Select Recognize workspace
        if: ${{ env.CLOUDSMITH_KEYLESS_TOKEN != '' }}
        env:
          CLOUDSMITH_KEYLESS_TOKEN: ${{ secrets.CLOUDSMITH_KEYLESS_TOKEN }}
        run: echo "WORKSPACE=SampleApps/PingWithRecognize.xcworkspace" >> "$GITHUB_ENV"

      - name: Strip RecognizeTests from test plan (no registry on fork PRs)
        if: ${{ env.CLOUDSMITH_KEYLESS_TOKEN == '' }}
        env:
          CLOUDSMITH_KEYLESS_TOKEN: ${{ secrets.CLOUDSMITH_KEYLESS_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json
          path = "PingTestHost/PingTestHost.xctestplan"
          with open(path) as f:
              plan = json.load(f)
          plan["testTargets"] = [
              t for t in plan["testTargets"]
              if t.get("target", {}).get("name") != "RecognizeTests"
          ]
          with open(path, "w") as f:
              json.dump(plan, f, indent=2)
          print("RecognizeTests removed from test plan (Keyless registry unavailable)")
          EOF

      - name: Reset simulators
        run: |
          xcrun simctl shutdown all || true
          xcrun simctl erase all || true
          
      # List available simulators
      - name: List available simulators
        run: xcrun simctl list devices

      # Pre-boot the simulator to avoid timeouts during xcodebuild
      - name: Pre-boot Simulator
        run: |
          xcrun simctl bootstatus "iPhone 17" -b || true

      # Build the SDK for testing
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -scheme "${{ env.SCHEME }}" \
            -workspace "${{ env.WORKSPACE }}" \
            -destination '${{ env.DESTINATION }}' \
            -derivedDataPath ${{ env.DERIVED_DATA_PATH }} \
            -clonedSourcePackagesDirPath SourcePackages \
            COMPILER_INDEX_STORE_ENABLE=NO | xcbeautify

      # Inject DaVinci e2e config (no-op when secret is absent — fork PRs)
      - name: Inject DaVinci e2e config
        env:
          DAVINCI_E2E_CONFIG: ${{ secrets.DAVINCI_E2E_CONFIG }}
        run: |
          if [ -n "$DAVINCI_E2E_CONFIG" ]; then
            echo "$DAVINCI_E2E_CONFIG" > Davinci/DavinciTests/Configuration/DaVinci-e2e-config.json
          fi

      # Run the unit tests without building
      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -scheme "${{ env.SCHEME }}" \
            -workspace "${{ env.WORKSPACE }}" \
            -destination '${{ env.DESTINATION }}' \
            -derivedDataPath ${{ env.DERIVED_DATA_PATH }} \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -parallel-testing-worker-count 1 \
            -retry-tests-on-failure | xcbeautify

      # # Run unit tests
      # - name: Run tests
      #   run: |
      #     set -o pipefail && xcodebuild test \
      #     -scheme ${{ env.SCHEME }} \
      #     -workspace ${{ env.WORKSPACE }} \
      #     -destination '${{ env.DESTINATION }}' \
      #     -derivedDataPath ${{ env.DERIVED_DATA_PATH }} \
      #     -clonedSourcePackagesDirPath SourcePackages \
      #     -parallel-testing-enabled NO \
      #     -retry-tests-on-failure \
      #     COMPILER_INDEX_STORE_ENABLE=NO \
      #     -resultBundlePath TestResults | xcbeautify

      #     # -configuration ${{ env.CONFIGURATION}} \
      #     # TEST_TARGET_SIGNING=YES \
      #     # -enableCodeCoverage YES \
      #     # -resultBundlePath TestResults \
      #     # -disable-concurrent-destination-testing \
      #     # -retry-tests-on-failure 
          
      # Upload xcresult for debugging purposes
      - name: Upload xcresult (debug)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult

      # Convert test results to JUnit format
      - name: Convert Test Results to JUnit
        if: always()
        run: xcresultparser -o junit TestResults.xcresult > test-report.xml

      # Publish the test results
      # dorny/test-reporter needs checks:write which is unavailable for fork PRs
      - name: Publish test results
        if: (success() || failure()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@v1
        with:
          name: Unit tests results
          path: test-report.xml
          list-suites: 'all'
          list-tests: 'all'
          fail-on-error: 'false'
          reporter: java-junit
      
      # Send slack notification with result status
      - uses: 8398a7/action-slack@v3
        with:
          mention: 'stoyan.petrov'
          if_mention: 'failure,cancelled'
          fields: repo,author,eventName,message,job,pullRequest,took
          status: ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)