name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches:
      - master
      - develop

  # Allows maintainers to trigger the full CI against a fork PR by commenting /run-ci
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

jobs:
  # Resolves head SHA and repo for all event types.
  # For issue_comment, also validates the /run-ci command and commenter permissions,
  # and reacts with 👀 to acknowledge the trigger.
  resolve-context:
    name: Resolve PR context
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/run-ci') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    outputs:
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      head_repo: ${{ steps.ctx.outputs.head_repo }}
    steps:
      - name: React to /run-ci comment with 👀
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            if (context.payload.comment.body.trim() !== '/run-ci') {
              core.setFailed('Comment must be exactly "/run-ci" to trigger CI.');
              return;
            }
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Resolve head SHA and repo
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'push') {
              core.setOutput('head_sha', context.sha);
              core.setOutput('head_repo', `${context.repo.owner}/${context.repo.repo}`);
            } else if (context.eventName === 'pull_request') {
              core.setOutput('head_sha', context.payload.pull_request.head.sha);
              core.setOutput('head_repo', context.payload.pull_request.head.repo.full_name);
            } else {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              core.setOutput('head_sha', pr.data.head.sha);
              core.setOutput('head_repo', pr.data.head.repo.full_name);
            }

  # Build and run unit tests
  build-and-test:
    name: Build and test
    needs: resolve-context
    uses: ./.github/workflows/build-and-test.yaml
    with:
      head_sha: ${{ needs.resolve-context.outputs.head_sha }}
      head_repo: ${{ needs.resolve-context.outputs.head_repo }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Run Mend CLI Scan — skip for fork PRs (Mend credentials unavailable)
  mend-cli-scan:
    name: Mend CLI Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: resolve-context
    uses: ./.github/workflows/mend-cli-scan.yaml
    with:
      head_sha: ${{ needs.resolve-context.outputs.head_sha }}
      head_repo: ${{ needs.resolve-context.outputs.head_repo }}
    secrets:
      MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
      MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Generate API Docs — only on pushes to main branches, not on PRs
  generate-docs:
    name: Generate API Docs
    if: github.event_name == 'push'
    uses: ./.github/workflows/docs.yaml

  # Calculate package sizes — not applicable for issue_comment (no PR merge ref available)
  package-sizes:
    name: Package Sizes
    if: github.event_name != 'issue_comment'
    uses: ./.github/workflows/package-sizes.yml

  # Build BrowserStack test artifacts — skip for fork PRs (signing secrets unavailable)
  browserstack-prepare-artifacts:
    name: Prepare device farm artifacts
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - build-and-test
      - resolve-context
    uses: ./.github/workflows/browserstack-prepare-artifacts.yaml
    with:
      head_sha: ${{ needs.resolve-context.outputs.head_sha }}
      head_repo: ${{ needs.resolve-context.outputs.head_repo }}
    secrets:
      CERTIFICATES_FILE_BASE64: ${{ secrets.CERTIFICATES_FILE_BASE64 }}
      CERTIFICATES_PASSWORD: ${{ secrets.CERTIFICATES_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      BUILD_PROVISION_PROFILE: ${{ secrets.BUILD_PROVISION_PROFILE_ZIP_BASE64}}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Execute e2e test cases in BrowserStack.
  browserstack-run:
    name: Run e2e tests in BrowserStack
    uses: ./.github/workflows/browserstack-run.yaml
    needs: browserstack-prepare-artifacts
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Wait for BrowserStack test run to finish and publish results
  browserstack-results:
    name: Wait for BrowserStack test results
    uses: ./.github/workflows/browserstack-results.yaml
    needs: browserstack-run
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    with:
      browserstack-build-id: ${{ needs.browserstack-run.outputs.build_id }}

  # Post /run-ci result back to the PR as a comment and update the reaction
  notify:
    name: Notify /run-ci result
    if: always() && github.event_name == 'issue_comment' && needs.resolve-context.result == 'success'
    needs:
      - resolve-context
      - build-and-test
      - mend-cli-scan
      - browserstack-results
    runs-on: ubuntu-latest
    steps:
      - name: Post result comment and update reaction
        uses: actions/github-script@v7
        with:
          script: |
            const results = [
              '${{ needs.build-and-test.result }}',
              '${{ needs.mend-cli-scan.result }}',
              '${{ needs.browserstack-results.result }}',
            ];
            const allPassed = results.every(r => r === 'success' || r === 'skipped');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: allPassed
                ? `✅ \`/run-ci\` — CI passed. [View run](${runUrl})`
                : `❌ \`/run-ci\` — CI failed. [View run](${runUrl})`
            });
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: allPassed ? 'rocket' : '-1'
            });
